<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#101e1d" />
    <meta
      name="description"
      content="A burnt match. A stolen dawn. One last light. Play Novaki's hand-crafted action roguelite."
    />
    <link rel="icon" type="image/png" href="./assets/images/novaki.png" />
    <title>Novaki — The Last Light</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="Novaki action roguelite game"></canvas>
      <div id="ui"></div>
      <div id="touch-controls">
        <div id="joystick">
          <div class="stick-ring"></div>
          <div class="stick-knob"></div>
        </div>
        <button id="touch-dash" aria-label="Dash">↗<small>DASH</small></button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
